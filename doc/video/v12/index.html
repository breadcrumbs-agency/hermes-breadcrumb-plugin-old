<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>breadcrumbs v12</title>
<style>
  @font-face { font-family: 'KaTeXMath'; src: url('fonts/KaTeX_Math-Italic.woff2') format('woff2'); }
  @font-face { font-family: 'KaTeXMain'; src: url('fonts/KaTeX_Main-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'KaTeXAMS'; src: url('fonts/KaTeX_AMS-Regular.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; color: #ddd; font: 14px 'JetBrains Mono', monospace; }
  #cv { display: block; width: 100vw; max-width: 1920px; aspect-ratio: 16 / 9; margin: 0 auto; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 16px; max-width: 1920px; margin: 0 auto; box-sizing: border-box; }
  #bar input { flex: 1; }
  #bar button { font: inherit; background: #1b2030; color: #ddd; border: 1px solid #333a50; padding: 4px 12px; border-radius: 6px; }
  body.capture #bar { display: none; }
  body.capture #cv { width: auto; max-width: none; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="bar"><button id="play">pause</button><input id="scrub" type="range" min="0" max="10000" value="0"><span id="clock">0.0s</span></div>
<audio id="score" preload="none"></audio>
<script src="film.js"></script>
<script>
  const params = new URLSearchParams(location.search), cv = document.getElementById('cv');
  if (params.has('w')) { cv.width = +params.get('w'); cv.height = Math.round(cv.width * 9 / 16); }
  // The level files. ?levels=00,03,stubs/01 names them (a bare name is levels/<name>.js) and every one must load.
  // Without it the player takes levels/00.js … 11.js and skips the ones that are not there.
  const wanted = params.get('levels');
  const names = wanted ? wanted.split(',').filter(Boolean) : Array.from({ length: 12 }, (_, i) => String(i).padStart(2, '0'));
  const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('cannot load ' + src)); document.head.append(s); });
  // window.ready settles when the levels are in and the film is built; render.mjs waits for it.
  window.ready = (async () => {
    for (const n of names) { try { await load((n.includes('/') ? n : 'levels/' + n) + '.js'); } catch (e) { if (wanted) throw e; } }
    Film.build(); Film.bind(cv);
    window.renderAt = t => Film.frame(t);
  })();
  if (params.has('capture')) document.body.classList.add('capture');
  else {
    const audio = document.getElementById('score'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), btn = document.getElementById('play');
    audio.preload = 'auto'; audio.src = 'score.m4a';
    let playing = true, t0 = performance.now(), offset = 0;
    const now = () => playing ? offset + (performance.now() - t0) / 1000 : offset;
    const sync = t => { try { audio.currentTime = t; if (playing) audio.play().catch(() => {}); else audio.pause(); } catch (e) {} };
    // Browsers refuse sound until the viewer interacts: the first click or key anywhere starts it at the film's time.
    const unmute = () => { if (playing && audio.paused) sync(now()); };
    addEventListener('pointerdown', unmute, { once: true });
    addEventListener('keydown', unmute, { once: true });
    // Sound that starts late (buffering, a refused autoplay) joins at the film's time rather than at its own zero.
    audio.addEventListener('playing', () => { const t = now(); if (Math.abs(audio.currentTime - t) > 0.05) audio.currentTime = t; });
    btn.onclick = () => { offset = now(); playing = !playing; t0 = performance.now(); btn.textContent = playing ? 'pause' : 'play'; sync(offset); };
    scrub.oninput = () => { offset = scrub.value / 10000 * Film.duration; t0 = performance.now(); sync(offset); };
    window.ready.then(() => document.fonts.ready).then(() => {
      // The film starts when its levels and fonts are ready, not when the page was parsed.
      t0 = performance.now(); offset = 0;
      sync(0);
      (function loop() {
        // While the score plays it is the clock, so picture and sound cannot drift apart.
        if (playing && !audio.paused && !audio.seeking && audio.readyState >= 3) { offset = audio.currentTime; t0 = performance.now(); }
        let t = now();
        if (t >= Film.duration) { offset = 0; t0 = performance.now(); t = 0; sync(0); }
        renderAt(t); scrub.value = Math.round(t / Film.duration * 10000); clock.textContent = t.toFixed(1) + 's';
        requestAnimationFrame(loop);
      })();
    });
  }
</script>
</body>
</html>
