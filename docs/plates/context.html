<script type="application/json" id="measure"></script>
<script>
(function(){
  const out={words:[],texts:[],marks:[],panels:[],bars:[],dots:[],caps:[],circles:[],lines:[],title:null};
  const box=r=>({x:r.left,y:r.top,w:r.width,h:r.height});
  const num=(e,a)=>parseFloat(e.getAttribute(a));
  const plate=document.getElementById('plate');
  const walk=document.createTreeWalker(plate,NodeFilter.SHOW_TEXT);
  for(let n=walk.nextNode();n;n=walk.nextNode()){
    const el=n.parentElement;
    if(!n.nodeValue.trim())continue;
    const cat=(el.closest('[data-cat]')||{dataset:{}}).dataset.cat||'?';
    const re=/\S+/g;let m;
    while((m=re.exec(n.nodeValue))){
      const r=document.createRange();r.setStart(n,m.index);r.setEnd(n,m.index+m[0].length);
      out.words.push(Object.assign({cat:cat,set:((el.closest('[data-cat]')||{dataset:{}}).dataset.set)||null,word:m[0],font:parseFloat(getComputedStyle(el).fontSize)},box(r.getBoundingClientRect())));
    }
  }
  document.querySelectorAll('[data-cat]').forEach(e=>out.texts.push(Object.assign({cat:e.dataset.cat,set:e.dataset.set||null,text:e.textContent},box(e.getBoundingClientRect()))));
  document.querySelectorAll('.mark').forEach(e=>out.marks.push(Object.assign({text:e.textContent},box(e.getBoundingClientRect()))));
  document.querySelectorAll('.panel').forEach(e=>out.panels.push(Object.assign({id:e.id},box(e.getBoundingClientRect()))));
  document.querySelectorAll('rect.bar').forEach(e=>out.bars.push({row:e.dataset.row,ev:e.dataset.ev,level:+e.dataset.level,x:num(e,'x'),y:num(e,'y'),w:num(e,'width'),h:num(e,'height'),fill:e.getAttribute('fill'),opacity:num(e,'fill-opacity')}));
  document.querySelectorAll('circle.dot').forEach(e=>out.dots.push({index:+e.dataset.index,ev:e.dataset.ev,cx:num(e,'cx'),cy:num(e,'cy'),r:num(e,'r'),fill:e.getAttribute('fill')}));
  document.querySelectorAll('circle.cap').forEach(e=>out.caps.push({index:+e.dataset.index,cx:num(e,'cx'),cy:num(e,'cy'),r:num(e,'r')}));
  document.querySelectorAll('circle.vc').forEach(e=>out.circles.push({set:e.dataset.set,cx:num(e,'cx'),cy:num(e,'cy'),r:num(e,'r'),fill:e.getAttribute('fill')}));
  document.querySelectorAll('line').forEach(e=>out.lines.push({cls:e.getAttribute('class'),x1:num(e,'x1'),y1:num(e,'y1'),x2:num(e,'x2'),y2:num(e,'y2')}));
  const t=document.getElementById('title');out.title=Object.assign({text:t.textContent},box(t.getBoundingClientRect()));
  document.getElementById('measure').textContent=JSON.stringify(out);
})();
</script>
